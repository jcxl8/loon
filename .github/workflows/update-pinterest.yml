name: Update Pinterest Loon plugin

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build plugin from Pinterest rules
        run: python3 scripts/build_pinterest_plugin.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Plugin/Pinterest_remove_ads_Loon.lpx
          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi
          git commit -m "更新：Pinterest Loon 去广告插件"
          git push
